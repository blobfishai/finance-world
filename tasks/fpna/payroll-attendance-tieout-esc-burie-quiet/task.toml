schema_version = "1.4"

[task]
name = "fpna/payroll-attendance-tieout-esc-burie-quiet"
version = "0.1.0"
description = "Tie a semi-monthly payroll register back to the timekeeping export and the approved rate schedule: separate the hours variance that is correct from the rate variance that is invisible to an hours comparison."
authors = ["nario-ai"]
keywords = ["finance", "fpna", "payroll", "attendance", "reconciliation", "controls"]

[metadata]
family = "fpna"
origin = "escalated variant of fpna/payroll-attendance-tieout via sim/grow_tasks.py (buried_docs: governing policy hidden in the adjacent-policy library; quiet_prompt: explicit policy pointers removed from the ask); ground truth unchanged. Base: port of research/external/repos/TheAgentCompany/workspaces/tasks/finance-check-attendance-payroll (attendance x rate -> earnings, with the rate card held in a source separate from attendance); reframed from 'compute earnings' to 'tie out what payroll actually paid' per docs/HARD-LAYER-DESIGN.md M3 (objective non-collapse), M4 (money re-derived from hours x approved rate, never read back off the register) and M5 (the LWOP payability rule exists only in SOP-PAY-04, not as a field on either workbook)"
variant_of = "fpna/payroll-attendance-tieout"
difficulty = "hard"
acceptance_label = "pending_calibration"
doc_mode = "buried"
walk_len = 9

# Objective non-collapse (M3): the defensible naive strategy is the one the requester says he
# already ran - compare the attendance export's recorded hours against the register's paid
# hours, priced at the rate printed on the register. It flags E-1042 Devin Okafor, whose 16
# LWOP hours payroll correctly excluded (approved, LOA-2026-014, and not payable under
# SOP-PAY-04 s2), and it cannot see E-1044 Tomas Lindqvist at all, because his hours tie
# exactly and only the rate is wrong - keyed at 31.00 (Nadia Farouk's C4 rate) against an
# approved W3 rate of 29.50, so 86 hrs x 1.50 = 129.00 overpaid. The naive path therefore
# names a different discrepancy set and a different net (-592.00 vs -79.00): it funds a
# 384.00 correction for Devin, who was paid correctly, and it never sees Tomas at all, so it
# reports no overpayment (0.00 vs 129.00). It does recover Aisha Bello's real 208.00
# shortfall - her register rate happens to equal her approved rate, so the wrong method
# reaches the right number for her one line. Getting one line right by luck is not the same
# as running the reconciliation, and every graded field still separates the two.
# A second shortcut is also defeated: excluding ALL leave hours wrongly flags E-1043 Meera
# Raghunathan, whose 8 PTO hours are payable. Period totals give no cover either - worked
# hours (582) equal paid hours (582) because the two errors offset.
naive_answer = "E-1042,E-1045; net -592.00; short-paid Devin Okafor 384.00 and Aisha Bello 208.00; overpayment 0.00"
graded_answer = "E-1044,E-1045; net -79.00; short-paid Aisha Bello 208.00"

[verifier]
timeout_sec = 120
[agent]
timeout_sec = 900
[environment]
cpus = 1
memory_mb = 1024
