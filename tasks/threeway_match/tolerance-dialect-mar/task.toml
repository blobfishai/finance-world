schema_version = "1.4"

[task]
name = "threeway_match/tolerance-dialect-mar"
version = "0.1.0"
description = "Two match exceptions, two tolerance dialects: an unmaintained key means ZERO tolerance (blocks), a blank limit means UNLIMITED (passes)."
authors = ["nario-ai"]
keywords = ["finance", "threeway_match", "tolerance", "ap"]

[metadata]
family = "threeway_match"
origin = "research/external/articles: SAP unmaintained tolerance key = zero tolerance vs Oracle Fusion blank tolerance = infinite — inverted defaults across systems"
difficulty = "hard"
acceptance_label = "pending_calibration"
walk_len = 5
trap = "the SMALLER variance is the one that blocks; treating 'no limit configured' as permissive in both systems fails"

[verifier]
timeout_sec = 120
[agent]
timeout_sec = 600
[environment]
cpus = 1
memory_mb = 1024
